events {
    worker_connections 1024;
}

http {
    # Load balancing configuration for scalable services
    upstream room_service {
        # Docker Compose automatically resolves to all instances
        server room-service:3001;
        # Additional load balancing options
        least_conn;  # Route to server with least connections
    }

    upstream drawing_service {
        server drawing-service:3002;
        least_conn;
    }

    upstream chat_service {
        server chat-service:3003;
        least_conn;
    }

    upstream websocket_gateway {
        server websocket-gateway:3004;
        # For WebSockets, use ip_hash to maintain sticky sessions
        ip_hash;
    }

    server {
        listen 80;
        server_name localhost;

        # Room Service
        location /api/rooms/ {
            rewrite ^/api/rooms/(.*)$ /rooms/$1 break;
            proxy_pass http://room_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Load balancing and failover settings
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_connect_timeout 2s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # Drawing Service
        location /api/drawing/ {
            rewrite ^/api/drawing/(.*)$ /drawing/$1 break;
            proxy_pass http://drawing_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Load balancing and failover settings
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_connect_timeout 2s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # Chat Service
        location /api/chat/ {
            rewrite ^/api/chat/(.*)$ /chat/$1 break;
            proxy_pass http://chat_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Load balancing and failover settings
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_connect_timeout 2s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # Socket.IO WebSocket Gateway
        location /socket.io/ {
            proxy_pass http://websocket_gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_connect_timeout 60s;
        }

        # Legacy WebSocket route (if needed)
        location /ws {
            proxy_pass http://websocket_gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
